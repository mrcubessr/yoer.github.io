<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>产品详情 · 优尔数学思维启蒙盒</title>
  <meta name="description" content="优尔 L1/L2/L3 数学思维启蒙套盒产品详情：玩法、教具清单、配套视频课。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ea580c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="优尔启蒙">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="back-btn" id="backBtn" aria-label="返回">‹</button>
      <div class="titles">
        <b id="dTitle">产品详情</b>
        <span>优尔思维启蒙商城</span>
      </div>
    </div>
  </header>

  <main id="detailRoot">
    <!-- JS 渲染 -->
  </main>

  <div class="buybar-spacer"></div>
  <div class="buybar">
    <div class="buybar-inner">
      <div class="p-info">
        <div class="price" id="buybarPrice"></div>
        <em id="buybarNote">正品保障 · 含配套视频课</em>
      </div>
      <button class="cta" id="buyBtn">立即购买</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="products.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const p = PRODUCTS[id];
    if (!p) { location.replace('index.html'); throw new Error('bad id'); }

    document.title = p.name + ' · 优尔数学思维启蒙盒';
    document.getElementById('dTitle').textContent = p.name;

    const lvClass = p.theme === 'green' ? ' lv-green' : p.theme === 'red' ? ' lv-red' : '';
    const slides = [...p.gallery, p.detailImg].filter(Boolean);

    document.getElementById('detailRoot').innerHTML = `
      <!-- 轮播图 -->
      <div class="gallery">
        <div class="slides" id="slides">
          ${slides.map(s => `<img src="${s}" alt="${p.name} 展示图" loading="lazy">`).join('')}
        </div>
        <span class="counter" id="slideCounter">1/${slides.length}</span>
      </div>

      <!-- 标题价格 -->
      <div class="d-head">
        <div class="wrap">
          <h1>${p.name}</h1>
          <p class="tagline">${p.tagline}</p>
          <div class="meta">
            ${[p.age, p.players, p.duration, '100+ 玩/教具', '培养领域 · ' + p.domain]
              .map(m => `<span>${m}</span>`).join('')}
          </div>
          <div class="d-price-row">
            <div class="price"><span class="cur">¥</span><span class="num">${p.price}</span><span class="unit"> /盒</span></div>
            <span class="sold">${p.level} 级 · 编号 ${p.id}</span>
          </div>
        </div>
      </div>

      <!-- 产品说明 -->
      <div class="wrap">
        <div class="d-sec">
          <h2>产品说明</h2>
          <p>${p.desc}</p>
        </div>

        ${p.sellTags ? `
        <div class="d-sec">
          <h2>${p.stats ? '课程体系速览' : '核心卖点'}</h2>
          <ul class="sell-list">${p.sellTags.map(s => `<li>${s}</li>`).join('')}</ul>
          ${p.stats ? `
          <div class="stats-grid">
            <div class="stat"><b>${p.stats.modules}</b><span>大能力模块</span></div>
            <div class="stat"><b>${p.stats.themes}</b><span>大课程主题</span></div>
            <div class="stat"><b>${p.stats.lessons}</b><span>个游戏课时</span></div>
            <div class="stat"><b>${p.stats.plans}</b><span>份标准教案</span></div>
            <div class="stat"><b>${p.stats.courseware}</b><span>份配套课件</span></div>
            <div class="stat"><b>${p.stats.videoLessons}</b><span>节真人视频课</span></div>
          </div>` : ''}
        </div>` : ''}

        ${p.modules ? `
        <div class="d-sec">
          <h2>${p.modulesTitle || '8 大能力模块（层层递进）'}</h2>
          ${p.modules.map((m, i) => `
            <div class="module">
              <div class="m-no">${(p.modulesTitle || '模块').includes('板块') ? '板块' : '模块'}${i + 1}</div>
              <div>
                <b>${m.name}${m.lessons ? `<em>${m.themes} 主题 · ${m.lessons} 课时</em>` : ''}</b>
                <span>${m.items}</span>
              </div>
            </div>`).join('')}
        </div>` : ''}

        <div class="d-sec">
          <h2>培养能力点</h2>
          <div class="chips">${p.abilities.map(a => `<span>${a}</span>`).join('')}</div>
        </div>

        ${p.sevenSteps ? `
        <div class="d-sec">
          <h2>7 步启蒙路径</h2>
          <div class="d-steps">
            ${p.sevenSteps.map((s, i) => `
              <div class="d-step">
                <div class="no">${i + 1}</div>
                <div><b>${s.t}</b><span>${s.d}</span></div>
              </div>`).join('')}
          </div>
        </div>` : ''}

        <div class="d-sec">
          <h2>玩法四步</h2>
          <div class="d-steps">
            ${p.steps.map((s, i) => `
              <div class="d-step">
                <div class="no">${i + 1}</div>
                <div><b>${s.t}</b><span>${s.d}</span></div>
              </div>`).join('')}
          </div>
        </div>

        <div class="d-sec">
          <h2>适合谁</h2>
          <div class="audience-box">${p.audience}</div>
        </div>

        ${p.outcomes ? `
        <div class="d-sec">
          <h2>学完 ${p.level}，孩子将获得</h2>
          ${p.outcomes.map(o => `
            <div class="outcome-group">
              <b>${o.g}</b>
              <p>${o.items}</p>
            </div>`).join('')}
        </div>` : ''}

        ${p.highlights ? `
        <div class="d-sec">
          <h2>${p.highlights.length} 大产品亮点</h2>
          ${p.highlights.map(h => `
            <div class="hl"><b>${h.t}</b><span>${h.d}</span></div>`).join('')}
        </div>` : ''}

        ${p.comparison ? `
        <div class="d-sec full-span">
          <h2>两条产品线 · 对比一览</h2>
          <table class="cmp-table">
            <thead>
              <tr>
                <th class="dim-h">对比维度</th>
                <th class="home-h">${p.homeTrack ? p.homeTrack.title : '家庭场景'}</th>
                <th class="kinder-h">${p.kindergartenTrack ? p.kindergartenTrack.title : '园所场景'}</th>
              </tr>
            </thead>
            <tbody>
              ${p.comparison.map(r => `
              <tr>
                <td class="dim">${r.dim}</td>
                <td class="home-c">${r.home}</td>
                <td class="kinder-c">${r.kinder}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>` : (p.homeTrack || p.kindergartenTrack) ? `
        <div class="d-sec">
          <h2>两条产品线 · 针对不同场景</h2>
          <div class="track-grid">
            ${p.homeTrack ? `
            <div class="track home">
              <div class="track-tag">家庭场景</div>
              <b>${p.homeTrack.title}</b>
              <em>${p.homeTrack.audience}</em>
              <p>${p.homeTrack.desc}</p>
              <div class="track-stats">
                <span><b>${p.homeTrack.videoLessons}</b><em>节视频课</em></span>
              </div>
              <ul>${p.homeTrack.highlights.map(h => `<li>${h}</li>`).join('')}</ul>
            </div>` : ''}
            ${p.kindergartenTrack ? `
            <div class="track kinder">
              <div class="track-tag">园所场景</div>
              <b>${p.kindergartenTrack.title}</b>
              <em>${p.kindergartenTrack.audience}</em>
              <p>${p.kindergartenTrack.desc}</p>
              <div class="track-stats">
                <span><b>${p.kindergartenTrack.lessonPlans}</b><em>份标准教案</em></span>
                <span><b>${p.kindergartenTrack.courseware}</b><em>份配套课件</em></span>
              </div>
              <ul>${p.kindergartenTrack.highlights.map(h => `<li>${h}</li>`).join('')}</ul>
            </div>` : ''}
          </div>
        </div>` : `
        ${p.scenarios ? `
        <div class="d-sec">
          <h2>使用场景</h2>
          <ul class="dot-list">${p.scenarios.map(s => `<li>${s}</li>`).join('')}</ul>
        </div>` : ''}

        <div class="d-sec">
          <h2>配套视频课</h2>
          <div class="course-box">
            <img src="${p.gallery[1] || p.mainImg}" alt="配套视频课" loading="lazy">
            <p>${p.courseNote}</p>
          </div>
        </div>
        `}

        <div class="d-sec full-span">
          <h2>盒内教具清单（100+ 玩/教具）</h2>
          <div class="contents-grid">${p.contents.map(c => `<span>${c}</span>`).join('')}</div>
          ${p.id === 'C01' ? '<a href="tools.html" style="display:inline-block;margin-top:12px;color:var(--brand);font-size:14px;font-weight:600;">查看教具图鉴 &amp; 课程材料明细表 →</a>' : ''}
          ${p.id === 'C02' ? '<a href="tools-l2.html" style="display:inline-block;margin-top:12px;color:#16a34a;font-size:14px;font-weight:600;">查看教具图鉴 &amp; 课程材料明细表 →</a>' : ''}
          ${p.id === 'C03' ? '<a href="tools-l3.html" style="display:inline-block;margin-top:12px;color:#7c3aed;font-size:14px;font-weight:600;">查看教具图鉴 &amp; 课程材料明细表 →</a>' : ''}
        </div>

        ${p.purchase ? `
        <div class="d-sec full-span">
          <h2>采购与服务</h2>
          <ul class="dot-list">${p.purchase.map(s => `<li>${s}</li>`).join('')}</ul>
        </div>` : ''}

        ${p.detailImg ? `
        <div class="d-sec long-img">
          <h2>图文详情</h2>
          <img src="${p.detailImg}" alt="${p.name} 图文详情" loading="lazy">
        </div>` : ''}

        <div class="d-sec full-span">
          <h2>查看其他级别</h2>
          <div class="switch-row">
            ${PRODUCT_ORDER.map(other => {
              const o = PRODUCTS[other];
              return `<a href="detail.html?id=${o.id}" class="${o.id === p.id ? 'cur' : ''}">${o.level} · ${o.age}</a>`;
            }).join('')}
          </div>
        </div>
      </div>
    `;

    // 轮播计数
    const slidesEl = document.getElementById('slides');
    const counter = document.getElementById('slideCounter');
    slidesEl.addEventListener('scroll', () => {
      const i = Math.round(slidesEl.scrollLeft / slidesEl.clientWidth) + 1;
      counter.textContent = `${Math.min(i, slides.length)}/${slides.length}`;
    }, { passive: true });

    // 购买栏
    document.getElementById('buybarPrice').innerHTML =
      `<span class="cur">¥</span><span class="num">${p.price}</span><span class="unit">/盒</span>`;

    const toast = document.getElementById('toast');
    let toastTimer;
    document.getElementById('buyBtn').addEventListener('click', () => {
      toast.textContent = '已加入意向清单，客服将尽快与您联系';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      if (document.referrer && document.referrer.includes(location.host)) history.back();
      else location.href = 'index.html';
    });

    // PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
