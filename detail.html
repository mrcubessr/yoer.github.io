<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>产品详情 · 优尔数学思维启蒙盒</title>
  <meta name="description" content="优尔 L1/L2/L3 数学思维启蒙套盒产品详情：玩法、教具清单、配套视频课。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ea580c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="优尔启蒙">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="desktop.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="back-btn" id="backBtn" aria-label="返回">‹</button>
      <div class="titles">
        <b id="dTitle">产品详情</b>
        <span>优尔思维启蒙商城</span>
      </div>
      <nav class="nav-menu">
        <a href="index.html#products">产品总览</a>
        <a href="syllabus.html">课程大纲</a>
        <a href="index.html#buy" class="nav-cta">咨询选购</a>
      </nav>
    </div>
  </header>

  <main id="detailRoot">
    <!-- JS 渲染 -->
  </main>

  <script src="products.js"></script>
  <script src="tools-data.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const p = PRODUCTS[id];
    if (!p) { location.replace('index.html'); throw new Error('bad id'); }
    const TOOLS_MAP = typeof TOOLS !== 'undefined' ? TOOLS : {};
    const THEMES_MAP = typeof THEMES !== 'undefined' ? THEMES : {};
    const toolsOf = TOOLS_MAP[p.id] || [];
    const themesOf = THEMES_MAP[p.id] || [];

    document.title = p.name + ' · 优尔数学思维启蒙盒';
    document.getElementById('dTitle').textContent = p.name;
    document.body.className = 'dpage d-' + p.id.toLowerCase();

    /* 轮播图：仅使用图集 */
    const slides = p.gallery.slice();
    const toolsHref = p.id === 'C01' ? 'tools.html' : 'tools-' + p.level.toLowerCase() + '.html';
    const hasTracks = !!(p.homeTrack || p.kindergartenTrack);

    /* ===== 两条主线卡片 ===== */
    function trackCol(track, type) {
      if (!track) return '';
      const isHome = type === 'home';
      const stats = isHome
        ? (track.videoLessons != null
            ? `<div class="track-stats"><span><b>${track.videoLessons}</b><em>节视频课</em></span></div>`
            : `<div class="track-stats"><span class="badge-video">视频在线课</span></div>`)
        : `<div class="track-stats"><span><b>${track.lessonPlans}</b><em>份标准教案</em></span><span><b>${track.courseware}</b><em>份配套课件</em></span></div>`;
      return `
        <div class="track ${isHome ? 'home' : 'kinder'}">
          <div class="track-tag">${isHome ? '家庭亲子体系' : '幼儿园课程体系'}</div>
          <b>${track.title}</b>
          <em>${track.audience}</em>
          <p>${track.desc}</p>
          ${stats}
          ${track.planNote ? `<div class="track-note">${track.planNote}</div>` : ''}
          <ul>${track.highlights.map(h => `<li>${h}</li>`).join('')}</ul>
        </div>`;
    }

    /* ===== 三阶连贯路径（展示三个级别的能力递进） ===== */
    const LADDER = PRODUCT_ORDER.map(k => {
      const q = PRODUCTS[k];
      return {
        lv: q.level,
        age: q.age,
        slogan: q.stage.slogan,
        ladder: q.stage.ladder,
        theme: q.theme
      };
    });
    const THEME_GRAD = {
      orange: 'linear-gradient(135deg,#fb923c,#ea580c)',
      green: 'linear-gradient(135deg,#4ade80,#16a34a)',
      red: 'linear-gradient(135deg,#f87171,#dc2626)'
    };

    /* ===== 五个界面的内容 ===== */
    const PANES = {};

    /* 总览：阶段定位 + 分段产品说明 + 三阶连贯路径 */
    const overviewBody = p.overviewParas && p.overviewParas.length ? p.overviewParas : null;
    PANES.overview = `
      <div class="d-sec stage-sec">
        <div class="stage-hero ${p.theme}">
          <span class="stage-label">阶段定位 · ${p.stage.label}</span>
          <p class="stage-slogan">${p.stage.slogan}</p>
          <p class="stage-focus">${p.stage.focus}</p>
          ${p.stage.goal ? `<div class="stage-goal"><b>这一阶段的目标</b><p>${p.stage.goal}</p></div>` : ''}
          ${p.stage.bridge ? `<div class="stage-bridge"><b>在整体路径中的位置</b><p>${p.stage.bridge}</p></div>` : ''}
        </div>
      </div>

      ${overviewBody ? `
      <div class="d-sec">
        <h2>产品说明</h2>
        ${overviewBody.map(o => `
          <div class="ov-para">
            <b>${o.h}</b>
            <p>${o.p}</p>
          </div>`).join('')}
      </div>` : `
      <div class="d-sec">
        <h2>产品说明</h2>
        <p>${p.desc}</p>
      </div>`}

      <div class="d-sec full-span">
        <h2>L1 → L2 → L3 · 一条路径</h2>
        <div class="ladder">
          ${LADDER.map(s => `
            <div class="ladder-item ${s.theme}">
              <div class="lv">${s.lv}</div>
              <div><b>${s.slogan}</b><span>${s.ladder}</span><em>${s.age}</em></div>
            </div>`).join('')}
        </div>
        <p class="ladder-note">三阶共用一条教具线：格米扑克 / 十格阵 → 数字卡 / 逻辑九宫格 → 24 算牌 / 主题算战棋盘。换的是玩法，不变的是数学思维的成长节奏——按 L1→L2→L3 顺序学，不跳级、不重复。</p>
      </div>

      ${p.sellTags ? `
      <div class="d-sec">
        <h2>${p.stats ? '课程体系速览' : '核心卖点'}</h2>
        <ul class="sell-list">${p.sellTags.map(s => `<li>${s}</li>`).join('')}</ul>
        ${p.stats ? `
        <div class="stats-grid">
          <div class="stat"><b>${p.stats.modules}</b><span>大能力模块</span></div>
          <div class="stat"><b>${p.stats.themes}</b><span>大课程主题</span></div>
          <div class="stat"><b>${p.stats.lessons}</b><span>个游戏课时</span></div>
          <div class="stat"><b>${p.stats.plans}</b><span>份标准教案</span></div>
          <div class="stat"><b>${p.stats.courseware}</b><span>份配套课件</span></div>
          <div class="stat"><b>${p.stats.videoLessons}</b><span>节真人视频课</span></div>
        </div>` : ''}
      </div>` : ''}

      <div class="d-sec">
        <h2>配套视频课</h2>
        <div class="course-box">
          <img src="${p.gallery[1] || p.mainImg}" alt="配套视频课" loading="lazy">
          <p>${p.courseNote}</p>
        </div>
      </div>
    `;

    /* 课程体系：家庭亲子 / 园所教学两条体系分开呈现，支持顶部切换直达 */
    const homeSyl = p.homeTrack && p.homeTrack.syllabus ? p.homeTrack.syllabus : null;
    const sylTotal = homeSyl ? homeSyl.filter(s => s.lessons != null).reduce((a, b) => a + b.lessons, 0) : 0;
    const kinderSyl = p.kindergartenTrack && p.kindergartenTrack.syllabus ? p.kindergartenTrack.syllabus : null;
    const kinderTotal = kinderSyl ? kinderSyl.reduce((a, b) => a + (b.lessons || 0), 0) : 0;

    /* 课程主题与材料对应表（幼儿园课程体系专用，放在园所体系板块内） */
    const themeColGames = themesOf.some(g => g.items.some(it => it.games));
    const themeColMonth = themesOf.some(g => g.items.some(it => it.month));
    const themeTotal = themesOf.reduce((a, g) => a + g.items.length, 0);
    function materialsFold() {
      if (!themesOf.length) return '';
      return `
        <details class="mat-fold">
          <summary>展开：课程主题与材料对应表（${themeTotal} 个主题）</summary>
          <div class="mat-body">
            ${themesOf.map(g => `
              <div class="mat-group">
                <h4>${g.title}</h4>
                <div class="mat-scroll">
                  <table class="mat-table">
                    <thead><tr>
                      <th class="seq">#</th><th>课程主题</th>
                      ${themeColMonth ? '<th>月份</th>' : ''}
                      ${themeColGames ? '<th>主要玩法</th>' : ''}
                      <th>核心内容</th><th>所需材料</th>
                    </tr></thead>
                    <tbody>
                      ${g.items.map(it => `<tr>
                        <td class="seq">${it.seq}</td>
                        <td class="course">${it.course}</td>
                        ${themeColMonth ? `<td class="mon">${it.month}</td>` : ''}
                        ${themeColGames ? `<td class="games">${it.games}</td>` : ''}
                        <td>${it.content}</td>
                        <td class="materials">${it.materials}</td>
                      </tr>`).join('')}
                    </tbody>
                  </table>
                </div>
              </div>`).join('')}
          </div>
        </details>`;
    }

    /* 单个体系板块 */
    function trackBlock(type) {
      if (type === 'home') {
        if (!p.homeTrack) return '';
        return `
        <div class="d-sec full-span track-block home">
          <h2>家庭亲子体系 · ${p.homeTrack.title}</h2>
          <p class="tb-note">家长自购 · 1 盒起 · 跟着真人视频课在家玩，每天 10–20 分钟；纯视频在线学习，无课件无教案。</p>
          ${trackCol(p.homeTrack, 'home')}
          ${homeSyl ? `
          <div class="syl-callout">纯视频在线学习 · 无课件 · 无教案</div>
          <div class="syl-board">
            ${homeSyl.map(s => `
              <div class="syl-item">
                <b>${s.name}</b>
                ${s.lessons != null ? `<span>${s.lessons} 节</span>` : `<span class="no-count">视频课</span>`}
              </div>`).join('')}
          </div>
          ${sylTotal > 0 ? `<div class="syl-total">合计 <b>${sylTotal}</b> 节真人视频课，按上方板块顺序在线学习</div>` : `<div class="syl-total">按上方板块顺序在线学习，逐步解锁</div>`}
          <a class="syl-link home-link" href="syllabus.html?lv=${p.level}&v=home">
            <b>查看 ${p.level} 家庭版完整大纲 →</b>
            <span>版块结构与节数明细 · 纯视频在线学习，无课件无教案</span>
          </a>
          <p class="syl-disclaimer">注：家庭版课程为视频在线学习形式，不含幼儿园版的标准教案与配套课件；该大纲内容由 AI 生成，仅供参考，实际课程以官方发布为准。</p>` : ''}
        </div>`;
      }

      if (!p.kindergartenTrack) return '';
      return `
        <div class="d-sec full-span track-block kinder">
          <h2>园所教学体系 · ${p.kindergartenTrack.title}</h2>
          <p class="tb-note">园所按班级起订 · ${p.kindergartenTrack.lessonPlans} 份标准教案 + ${p.kindergartenTrack.courseware} 份配套课件 · 集体 / 小组 / 区域 / 户外活动全场景覆盖。</p>
          ${trackCol(p.kindergartenTrack, 'kinder')}
          ${kinderSyl ? `
          <div class="syl-callout kinder">按季度排课 · ${p.kindergartenTrack.lessonPlans} 份标准教案 + ${p.kindergartenTrack.courseware} 份配套课件</div>
          <div class="syl-board">
            ${kinderSyl.map(s => `
              <div class="syl-item">
                <b>${s.name}</b>
                <span>${s.lessons} 课</span>
                <em>${s.note || ''}</em>
              </div>`).join('')}
          </div>
          <div class="syl-total">共 <b>${kinderTotal}</b> 个教学主题，两学期完整排课 · 盒内教具、材料与家庭版完全共用</div>` : ''}
          ${materialsFold()}
          <a class="syl-link kinder-link" href="syllabus.html?lv=${p.level}">
            <b>查看 ${p.level} 逐课明细表（含标准教案与配套课件）→</b>
            <span>${p.level === 'L3' ? '按学期 / 季度' : '按月份'}列出每一节课的核心内容、主要游戏与所需材料</span>
          </a>
        </div>`;
    }

    /* 两条体系共用：能力模块 + 启蒙路径 + 图文详情 */
    const sharedSections = () => `
      ${p.modules ? `
      <div class="d-sec full-span">
        <h2>${p.modulesTitle || '8 大能力模块（层层递进）'}</h2>
        <p style="margin-bottom:10px;">无论家庭还是园所，孩子都将沿以下能力模块循序渐进地成长：</p>
        ${p.modules.map((m, i) => `
          <div class="module">
            <div class="m-no">${(p.modulesTitle || '模块').includes('板块') ? '板块' : '模块'}${i + 1}</div>
            <div>
              <b>${m.name}${m.lessons ? `<em>${m.themes} 主题 · ${m.lessons} 课时</em>` : ''}</b>
              <span>${m.items}</span>
            </div>
          </div>`).join('')}
      </div>` : ''}

      ${p.sevenSteps ? `
      <div class="d-sec full-span">
        <h2>7 步启蒙路径</h2>
        <div class="d-steps">
          ${p.sevenSteps.map((s, i) => `
            <div class="d-step">
              <div class="no">${i + 1}</div>
              <div><b>${s.t}</b><span>${s.d}</span></div>
            </div>`).join('')}
        </div>
      </div>` : ''}

      ${p.detailImgs ? `
      <div class="d-sec full-span">
        <h2>产品图文详情</h2>
        <p class="longimg-note">点击任意图片可查看高清大图</p>
        <div class="longimg-grid">
          ${p.detailImgs.map((s, i) => `<a class="longimg" href="${s}" target="_blank" rel="noopener"><img src="${s}" alt="${p.name} 图文详情 ${i + 1}" loading="lazy"></a>`).join('')}
        </div>
      </div>` : ''}
    `;

    const TRACK_LABELS = { all: '两条体系都看', home: '家庭亲子套装', kinder: '园所教学套装' };
    PANES.curriculum = `
      <div class="track-switch full-span" id="trackSwitch">
        ${['all', 'home', 'kinder'].filter(k => k === 'all' || (k === 'home' ? p.homeTrack : p.kindergartenTrack))
          .map(k => `<button type="button" data-track="${k}" class="${k === 'all' ? 'on' : ''}">${TRACK_LABELS[k]}</button>`).join('')}
      </div>
      <div id="curriculumBody" class="full-span"></div>
      ${sharedSections()}
    `;

    /* 按当前选中的体系渲染课程体系内容 */
    let curTrack = 'all';
    function renderCurriculum() {
      const box = document.getElementById('curriculumBody');
      if (!box) return;
      let html = '';
      if (p.homeTrack && (curTrack === 'all' || curTrack === 'home')) html += trackBlock('home');
      if (p.kindergartenTrack && (curTrack === 'all' || curTrack === 'kinder')) html += trackBlock('kinder');
      if (!html) {
        html = `<div class="d-sec full-span">
          <h2>完整课程大纲</h2>
          <a class="syl-link" href="syllabus.html?lv=${p.level}">
            <b>查看 ${p.level} 逐课明细表 →</b>
            <span>按月份列出每一节课的核心内容、主要游戏与所需材料</span>
          </a>
        </div>`;
      }
      box.innerHTML = html;
      document.querySelectorAll('#trackSwitch button').forEach(btn => {
        btn.classList.toggle('on', (btn.dataset.track || 'all') === curTrack);
      });
    }

    PANES.play = `
      <div class="d-pair full-span">
        <div class="d-sec">
          <h2>玩法四步</h2>
          <div class="d-steps">
            ${p.steps.map((s, i) => `
              <div class="d-step">
                <div class="no">${i + 1}</div>
                <div><b>${s.t}</b><span>${s.d}</span></div>
              </div>`).join('')}
          </div>
        </div>

        <div class="d-sec">
          <h2>培养能力点</h2>
          ${p.abilityGroups ? p.abilityGroups.map(g => `
            <div class="ab-group">
              <b>${g.g}</b>
              <div class="chips">${g.items.map(a => `<span>${a}</span>`).join('')}</div>
            </div>`).join('') : `
            <div class="chips">${p.abilities.map(a => `<span>${a}</span>`).join('')}</div>`}
        </div>
      </div>

      ${p.playLines ? `
      <div class="d-sec full-span">
        <h2>本阶段玩法主线（${p.age}）</h2>
        <p class="sec-note" style="margin-bottom:12px;">按 ${p.stage.label}孩子的年龄特点与认知水平精选，每一条都对应盒内的具体教具或游戏。</p>
        ${p.playLines.map((l, i) => `
          <div class="play-line">
            <div class="pl-no">${i + 1}</div>
            <div><b>${l.n}</b><span>${l.d}</span></div>
          </div>`).join('')}
      </div>` : ''}

      ${p.outcomes ? `
      <div class="d-sec full-span">
        <h2>学完 ${p.level}，孩子将获得</h2>
        ${p.outcomes.map(o => `
          <div class="outcome-group">
            <b>${o.g}</b>
            <p>${o.items}</p>
          </div>`).join('')}
      </div>` : ''}

      ${p.highlights ? `
      <div class="d-sec full-span">
        <h2>${p.highlights.length} 大产品亮点</h2>
        ${p.highlights.map(h => `
          <div class="hl"><b>${h.t}</b><span>${h.d}</span></div>`).join('')}
      </div>` : ''}
    `;

    PANES.contents = `
      <div class="d-sec full-span">
        <h2>盒内教具清单（100+ 玩/教具）</h2>
        <p class="sec-note" style="margin-bottom:12px;">打开盒子就能玩的完整配置，无需另外准备学具；下表按类别列出，括号为数量。</p>
        <div class="contents-grid">${p.contents.map(c => `<span>${c}</span>`).join('')}</div>
      </div>

      ${toolsOf.length ? `
      <div class="d-sec full-span">
        <h2>教具图鉴（${toolsOf.length} 件核心教具）</h2>
        <p class="sec-note" style="margin-bottom:12px;">每一件教具对应哪些游戏、出现在多少节课里，一目了然。</p>
        <div class="tool-grid d-tool-grid">
          ${toolsOf.map(t => `
            <div class="tool-card">
              <div class="tool-img">${t.img
                ? `<img src="${t.img}" alt="${t.name}" loading="lazy">`
                : `<div class="tool-ph">教具</div>`}</div>
              <div class="tool-info">
                <b>${t.name}</b>
                ${t.use ? `<div class="aka">用于：${t.use}</div>` : ''}
                ${t.freq ? `<span class="freq">课程出现 ${t.freq}</span>` : ''}
              </div>
            </div>`).join('')}
        </div>
      </div>` : ''}

      <div class="d-sec full-span">
        <h2>材料怎么准备</h2>
        <ul class="dot-list">
          <li>盒内已配齐全部 reusable 教具与操作材料，家庭场景开盒即玩。</li>
          <li>园所集体教学需补的部分材料（色卡、自制图卡、PPT 等）已逐课列明，见「课程体系 → 园所教学体系 → 课程主题与材料对应表」。</li>
        </ul>
      </div>
    `;

    PANES.purchase = `
      ${p.comparison ? `
      <div class="d-sec full-span">
        <h2>两条产品线 · 对比一览</h2>
        <table class="cmp-table">
          <thead>
            <tr>
              <th class="dim-h">对比维度</th>
              <th class="home-h">${p.homeTrack ? p.homeTrack.title : '家庭场景'}</th>
              <th class="kinder-h">${p.kindergartenTrack ? p.kindergartenTrack.title : '园所场景'}</th>
            </tr>
          </thead>
          <tbody>
            ${p.comparison.map(r => `
            <tr>
              <td class="dim">${r.dim}</td>
              <td class="home-c">${r.home}</td>
              <td class="kinder-c">${r.kinder}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>` : ''}

      ${p.scenarios ? `
      <div class="d-sec">
        <h2>使用场景</h2>
        <ul class="dot-list">${p.scenarios.map(s => `<li>${s}</li>`).join('')}</ul>
      </div>` : ''}

      <div class="d-sec">
        <h2>适合谁</h2>
        <div class="audience-box">${p.audience}</div>
      </div>

      ${p.purchase ? `
      <div class="d-sec">
        <h2>采购与服务</h2>
        <ul class="dot-list">${p.purchase.map(s => `<li>${s}</li>`).join('')}</ul>
      </div>` : ''}

      <div class="d-sec full-span">
        <h2>查看其他级别</h2>
        <div class="switch-row">
          ${PRODUCT_ORDER.map(other => {
            const o = PRODUCTS[other];
            return `<a href="detail.html?id=${o.id}" class="${o.id === p.id ? 'cur' : ''}">${o.level} · ${o.age}</a>`;
          }).join('')}
        </div>
      </div>
    `;

    /* ===== 界面导航 ===== */
    const TABS = [
      { k: 'overview', t: '总览' },
      { k: 'curriculum', t: '课程体系' },
      { k: 'play', t: '玩法能力' },
      { k: 'contents', t: '盒内清单' },
      { k: 'purchase', t: '场景采购' }
    ];

    /* ===== 顶层：左图集 + 右简介，右侧两条产品线卡点击即直达对应体系 ===== */
    const trackSelect = hasTracks ? `
      <div class="track-select">
        <div class="ts-title">同一套教具 · 两套课程体系，点击卡片直接看对应内容</div>
        <div class="ts-cards">
          ${p.homeTrack ? `
          <button class="ts-card home" data-track="home" type="button">
            <span class="ts-tag">家庭亲子体系</span>
            <b>${p.homeTrack.title}</b>
            <em>${p.homeTrack.audience}</em>
            <em class="ts-cta">${p.homeTrack.videoLessons ? p.homeTrack.videoLessons + ' 节真人视频课' : '纯视频在线学习'} · 1 盒起 →</em>
          </button>` : ''}
          ${p.kindergartenTrack ? `
          <button class="ts-card kinder" data-track="kinder" type="button">
            <span class="ts-tag">园所教学体系</span>
            <b>${p.kindergartenTrack.title}</b>
            <em>${p.kindergartenTrack.audience}</em>
            <em class="ts-cta">${p.kindergartenTrack.lessonPlans} 份教案 + ${p.kindergartenTrack.courseware} 份课件 · 按班起订 →</em>
          </button>` : ''}
        </div>
      </div>` : '';

    document.getElementById('detailRoot').innerHTML = `
      <div class="d-top">
        <!-- 左：图片展示区域 -->
        <div class="d-gallery">
          <div class="slides" id="slides">
            ${slides.map(s => `<img src="${s}" alt="${p.name} 展示图" loading="lazy">`).join('')}
          </div>
          <span class="counter" id="slideCounter">1/${slides.length}</span>
        </div>

        <!-- 右：基础介绍 + 总览（不超出左侧高度） -->
        <div class="d-intro">
          <h1>${p.name}</h1>
          <p class="tagline">${p.tagline}</p>
          <div class="meta">
            ${[p.age, p.players, p.duration, '100+ 玩/教具', '培养领域 · ' + p.domain]
              .map(m => `<span>${m}</span>`).join('')}
          </div>
          <p class="intro-desc">${p.desc}</p>
          ${trackSelect}
        </div>
      </div>

      <!-- 界面导航 -->
      <nav class="d-tabs" id="dTabs" aria-label="详情页分区导航">
        ${TABS.map(t => `<a href="?id=${p.id}&tab=${t.k}" data-k="${t.k}" class="${t.k === 'overview' ? 'on' : ''}">${t.t}</a>`).join('')}
      </nav>

      <!-- 界面内容（整体下方，横版铺开） -->
      <div class="d-panes" id="dPanes">
        ${TABS.map(t => `<div class="d-pane${t.k === 'overview' ? ' on' : ''}" data-k="${t.k}"><div class="wrap">${PANES[t.k]}</div></div>`).join('')}
      </div>
    `;

    /* ===== 界面切换（可直达 / 可分享 / 支持后退） ===== */
    function tabFromUrl() {
      const t = new URLSearchParams(location.search).get('tab');
      return TABS.some(x => x.k === t) ? t : 'overview';
    }
    function trackFromUrl() {
      const t = new URLSearchParams(location.search).get('track');
      return ['home', 'kinder'].indexOf(t) >= 0 ? t : 'all';
    }
    function syncUrl(tab, track) {
      const u = new URL(location.href);
      u.searchParams.set('tab', tab);
      if (track && track !== 'all') u.searchParams.set('track', track);
      else u.searchParams.delete('track');
      history.pushState({ tab: tab, track: track || 'all' }, '', u);
    }

    function showTab(k, push, track) {
      const panes = document.querySelectorAll('.d-pane');
      const tabs = document.querySelectorAll('.d-tabs a');
      panes.forEach(el => el.classList.toggle('on', el.dataset.k === k));
      tabs.forEach(el => el.classList.toggle('on', el.dataset.k === k));

      if (push) syncUrl(k, track !== undefined ? track : curTrack);
    }

    /* 体系切换：只重渲课程体系分区，不影响其他分区 */
    function setTrack(k, push, scroll) {
      curTrack = ['home', 'kinder', 'all'].indexOf(k) >= 0 ? k : 'all';
      renderCurriculum();
      const u = new URL(location.href);
      u.searchParams.set('tab', 'curriculum');
      u.searchParams.set('track', curTrack);
      document.querySelectorAll('.ts-card').forEach(btn => {
        btn.classList.toggle('on', btn.dataset.track === curTrack);
      });
      if (push) history.pushState({ tab: 'curriculum', track: curTrack }, '', u);
      if (scroll) {
        const top = document.getElementById('dPanes').getBoundingClientRect().top + window.scrollY - 64;
        window.scrollTo({ top: top, behavior: 'smooth' });
      }
    }

    document.getElementById('dPanes').addEventListener('click', e => {
      const btn = e.target.closest('button[data-track]');
      if (!btn) return;
      setTrack(btn.dataset.track, true, true);
    });

    document.getElementById('dTabs').addEventListener('click', e => {
      const a = e.target.closest('a[data-k]');
      if (!a) return;
      e.preventDefault();
      if (a.dataset.k === tabFromUrl()) {
        // 已在该标签，仍滚动到内容区顶部
        const top = document.getElementById('dPanes').getBoundingClientRect().top + window.scrollY - 64;
        window.scrollTo({ top: top, behavior: 'smooth' });
        return;
      }
      showTab(a.dataset.k, true);
    });

    /* 顶层两条产品线卡 → 直接筛选对应体系内容并进入课程体系 */
    document.querySelectorAll('.ts-card').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.track;
        if (t) setTrack(t, true, false);
        showTab('curriculum', false, t);
        document.querySelectorAll('.d-tabs a').forEach(a => {
          a.classList.toggle('on', a.dataset.k === 'curriculum');
        });
        const top = document.getElementById('dPanes').getBoundingClientRect().top + window.scrollY - 64;
        window.scrollTo({ top: top, behavior: 'smooth' });
      });
    });

    window.addEventListener('popstate', e => {
      const st = e.state || {};
      if (st.track && st.track !== curTrack) { curTrack = st.track; renderCurriculum(); }
      showTab(st.tab || tabFromUrl(), false, st.track || trackFromUrl());
    });

    /* 初始化：从 URL 读取 tab / track */
    curTrack = trackFromUrl();
    showTab(tabFromUrl(), false, curTrack);
    renderCurriculum();

    /* ===== 轮播计数 ===== */
    const slidesEl = document.getElementById('slides');
    const counter = document.getElementById('slideCounter');
    slidesEl.addEventListener('scroll', () => {
      const i = Math.round(slidesEl.scrollLeft / slidesEl.clientWidth) + 1;
      counter.textContent = `${Math.min(i, slides.length)}/${slides.length}`;
    }, { passive: true });

    document.getElementById('backBtn').addEventListener('click', () => {
      if (document.referrer && document.referrer.includes(location.host)) history.back();
      else location.href = 'index.html';
    });

    // PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
