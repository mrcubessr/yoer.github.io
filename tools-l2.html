var lb = document.getElementById('lightbox'), lbImg = document.getElementById('lbImg');
var lbPrev = document.getElementById('lbPrev'), lbNext = document.getElementById('lbNext'), lbCount = document.getElementById('lbCount');
var list = [], idx = 0;
function show() {
  lbImg.src = list[idx];
  var multi = list.length > 1;
  lbPrev.style.display = lbNext.style.display = lbCount.style.display = multi ? 'block' : 'none';
  lbCount.textContent = (idx + 1) + ' / ' + list.length;
}
document.querySelectorAll('#photoGrid .tool-card').forEach(function(card) {
  card.addEventListener('click', function() {
    list = PHOTOS[parseInt(card.getAttribute('data-idx'), 10)].imgs; idx = 0;
    show(); lb.classList.add('show');
  });
});
function go(d) { idx = (idx + d + list.length) % list.length; show(); }
lbNext.addEventListener('click', function(e) { e.stopPropagation(); go(1); });
lbPrev.addEventListener('click', function(e) { e.stopPropagation(); go(-1); });
document.getElementById('lbClose').addEventListener('click', function() { lb.classList.remove('show'); });
lb.addEventListener('click', function(e) { if (e.target === lb) lb.classList.remove('show'); });
document.addEventListener('keydown', function(e) {
  if (!lb.classList.contains('show')) return;
  if (e.key === 'Escape') lb.classList.remove('show');
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
});

if (navigator.onLine === false) document.getElementById('offlineTip').style.display = 'block';
window.addEventListener('online', function() { document.getElementById('offlineTip').style.display = 'none'; });
window.addEventListener('offline', function() { document.getElementById('offlineTip').style.display = 'block'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
