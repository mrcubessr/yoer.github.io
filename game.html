<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>游戏详情 · 优尔经典桌游</title>
  <meta name="description" content="优尔经典桌游：格米的数学派对、疯狂大请客、智趣方格。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ea580c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="优尔启蒙">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* 游戏页专属：英文副标 + 主题徽章 */
    .en-name { font-size: 12px; letter-spacing: 3px; font-weight: 700; opacity: .55; margin-bottom: 4px; }
    .level-tag {
      display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 600;
      color: var(--brand); background: var(--brand-bg); border: 1px solid color-mix(in srgb, var(--brand) 25%, transparent);
      padding: 4px 12px; border-radius: 999px;
    }
    .price-text { color: var(--brand); font-weight: 800; font-size: 26px; line-height: 1; }
    .price .prefix, .buybar .prefix { font-size: 13px; font-weight: 700; color: var(--brand); opacity: .9; margin-right: 3px; align-self: center; }
    .game-switch img { width: 100%; border-radius: 8px; aspect-ratio: 16/10; object-fit: cover; background: #f9fafb; }
    .game-switch {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;
    }
    .game-switch a {
      border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center;
      text-decoration: none; color: var(--ink); font-size: 12.5px; font-weight: 600; background: #fff;
    }
    .game-switch a.cur { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
    .game-switch a span { display: block; margin-top: 5px; }
    .contents-note { margin-top: 10px; font-size: 12px; color: var(--ink-2); }

    /* 桌面横版：正文双列网格（与 L1–L3 详情页统一，顶部 d-top 复用详情页样式） */
    @media (min-width: 900px) {
      .game-page { max-width: 1180px; margin: 0 auto; }
      .game-page .g-body { max-width: 1180px; }
      .game-page .g-body {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
        align-items: start;
      }
      .game-page .g-body > .d-sec { margin-top: 0; }
      .game-page .g-body > .full-span { grid-column: 1 / -1; }
      .game-page .course-box img { width: 150px; }
      /* 满宽大区块内部双列，避免半栏挤长文、半栏留大空白 */
      .game-page .g-body .cols2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 32px; align-items: start; }
    }
    @media (min-width: 1200px) {
      .game-page, .game-page .g-body { max-width: 1480px; }
      .game-page .g-body { grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 0 32px; }
      .game-page .g-body .cols2 { gap: 10px 40px; }
    }

    /* ===== 格米的数学派对 · 视觉化重排（pv-*，仅 .pv-page 生效） ===== */
    .pv-page { --pv-g1:#0e6b48; --pv-g2:#083b28; --pv-deep:#062e1f; --pv-cream:#f8f3e5;
      --pv-coral:#e8552f; --pv-gold:#f2c14e; --pv-ink:#12362a; }
    .pv-page .d-gallery { background: var(--pv-deep); }
    .pv-page .d-gallery .slides img { aspect-ratio: 4 / 3; object-fit: cover; background: var(--pv-deep); }
    .pv-page .d-intro .tagline { color: var(--pv-coral); }

    .pv-band, .pv-cream {
      grid-column: 1 / -1; border-radius: 20px; margin-top: 12px; overflow: hidden;
      position: relative; padding: 24px 20px;
    }
    .pv-band {
      background: linear-gradient(180deg, var(--pv-g1), var(--pv-g2)); color: #f3eee0;
      box-shadow: 0 18px 44px -32px rgba(6,46,31,.95);
    }
    .pv-band::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.045) 0 1px, transparent 1px 11px);
    }
    .pv-band > * { position: relative; }
    .pv-cream { background: var(--pv-cream); color: var(--pv-ink); border: 1px solid #e6dfc9; }

    .pv-h { font-size: 20px; font-weight: 900; letter-spacing: .5px; text-align: center; color: #fdf9ee; }
    .pv-h2 { font-size: 20px; font-weight: 900; letter-spacing: .5px; text-align: center; color: var(--pv-ink); }
    .pv-sub { text-align: center; font-size: 12.8px; color: rgba(243,238,224,.82); margin-top: 8px; }

    /* 六个数学收获点 */
    .pv-points { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 17px; }
    .pv-points span {
      font-size: 13.5px; font-weight: 700; color: #eafaf1; background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.28); padding: 7px 15px; border-radius: 999px;
    }

    /* 三大支柱 */
    .pv-pillars { display: grid; gap: 13px; }
    .pv-pillar {
      display: flex; gap: 14px; align-items: flex-start; position: relative; overflow: hidden;
      background: #fffdf7; border: 1px solid #e8e1cb; border-radius: 14px; padding: 15px 16px;
    }
    .pv-pillar::after {
      content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 5px;
      background: linear-gradient(var(--pv-coral), var(--pv-gold));
    }
    .pv-no {
      flex: none; width: 38px; height: 38px; border-radius: 11px; font-family: Georgia, serif;
      background: linear-gradient(140deg, var(--pv-g1), var(--pv-deep)); color: var(--pv-gold);
      font-weight: 900; font-size: 19px; display: grid; place-items: center;
    }
    .pv-ptxt b { font-size: 15.5px; font-weight: 800; color: var(--pv-ink); display: block; }
    .pv-ptxt p { font-size: 13px; color: #4b6259; margin-top: 4px; line-height: 1.7; }

    /* 双游戏模式 */
    .pv-script, .pv-script2 {
      text-align: center; font-style: italic; font-weight: 700; line-height: 1; margin-bottom: 3px;
      font-family: "Segoe Script", "Brush Script MT", cursive; font-size: 24px;
    }
    .pv-script { color: var(--pv-gold); opacity: .85; }
    .pv-script2 { color: var(--pv-coral); opacity: .85; }
    .pv-mode-grid { display: grid; gap: 16px; margin-top: 17px; }
    .pv-mode { margin: 0; border-radius: 16px; overflow: hidden;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.16); }
    .pv-mode img { width: 100%; display: block; aspect-ratio: 16 / 11; object-fit: cover; }
    .pv-mode figcaption { padding: 14px 16px 16px; }
    .pv-chip { display: inline-block; font-size: 11.5px; font-weight: 800; letter-spacing: .5px;
      color: var(--pv-deep); background: var(--pv-gold); padding: 3px 10px; border-radius: 999px; }
    .pv-mode figcaption b { display: block; font-size: 17px; font-weight: 900; color: #fdf9ee; margin-top: 8px; }
    .pv-mode figcaption p { font-size: 13px; color: rgba(243,238,224,.85); margin-top: 5px; line-height: 1.72; }

    /* 派对主题 */
    .pv-pd { text-align: center; font-size: 13.5px; color: #4b6259; margin-top: 10px; line-height: 1.75; }
    .pv-partyimg { width: 100%; max-width: 520px; display: block; margin: 18px auto 0; border-radius: 16px; }

    /* 怎么玩 */
    .pv-howimg { width: 100%; display: block; border-radius: 14px; margin-top: 15px;
      border: 1px solid rgba(255,255,255,.16); }
    .pv-mech { display: grid; gap: 10px; margin-top: 15px; }
    .pv-mech-item { display: flex; gap: 12px; align-items: flex-start; border-radius: 13px; padding: 13px 14px;
      background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.14); }
    .pv-mn { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
      background: var(--pv-gold); color: var(--pv-deep); font-weight: 900; font-size: 13px; }
    .pv-mech-item b { font-size: 14.5px; font-weight: 800; color: #fdf9ee; }
    .pv-mech-item em { font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--pv-gold); margin-left: 7px; }
    .pv-mech-item p { font-size: 12.8px; color: rgba(243,238,224,.82); margin-top: 4px; line-height: 1.7; }

    /* 好教具 */
    .pv-tool-grid { display: grid; gap: 15px; margin-top: 15px; }
    .pv-tool { margin: 0; background: #fffdf7; border: 1px solid #e8e1cb; border-radius: 15px; overflow: hidden; }
    .pv-tool img { width: 100%; display: block; aspect-ratio: 4 / 3; object-fit: cover; }
    .pv-tool figcaption { padding: 13px 15px 15px; }
    .pv-tool figcaption b { font-size: 15px; font-weight: 800; color: var(--pv-ink); }
    .pv-tool figcaption p { font-size: 12.8px; color: #4b6259; margin-top: 4px; line-height: 1.7; }

    .pv-kitimg { width: 100%; display: block; border-radius: 14px; margin-top: 15px;
      border: 1px solid rgba(255,255,255,.16); }

    @media (min-width: 700px) {
      .pv-band, .pv-cream { padding: 32px 30px; }
      .pv-h, .pv-h2 { font-size: 24px; }
      .pv-sub { font-size: 14px; }
      .pv-mode-grid, .pv-tool-grid, .pv-mech { grid-template-columns: 1fr 1fr; }
      .pv-mech .pv-mech-item:last-child { grid-column: 1 / -1; }
    }
  </style>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="back-btn" id="backBtn" aria-label="返回">‹</button>
      <div class="titles">
        <b id="dTitle">游戏详情</b>
        <span>优尔经典桌游</span>
      </div>
    </div>
  </header>

  <main id="detailRoot" class="game-page">
    <!-- JS 渲染 -->
  </main>

  <div class="buybar-spacer"></div>
  <div class="buybar">
    <div class="buybar-inner">
      <div class="p-info">
        <div class="price" id="buybarPrice"></div>
        <em id="buybarNote"></em>
      </div>
      <button class="cta" id="buyBtn">咨询 / 购买</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="games.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id') || 'party';
    const g = GAMES[id];
    if (!g) { location.replace('index.html'); throw new Error('bad game id'); }

    // 主题色注入
    const LIGHT = { party: '#4ade80', feast: '#fb7185', grid: '#fbbf24', m24: '#fde047', bus: '#7dd3fc', giraffe: '#c4b5fd', strawberry: '#fca5a5', logic: '#f9a8d4', racer: '#e879f9', space: '#a5b4fc', nemo: '#67e8f9', market: '#fbbf24', ocean: '#38bdf8', farm: '#a3e635', kingdom: '#60a5fa' };
    const root = document.documentElement.style;
    root.setProperty('--brand', g.themeColor);
    root.setProperty('--brand-light', LIGHT[id]);
    root.setProperty('--brand-bg', g.themeColorSoft);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', g.themeColor);

    document.title = g.name + ' · 优尔经典桌游';
    document.getElementById('dTitle').textContent = g.name;

    // 有 visual 数据的产品走「视觉化重排」皮肤
    document.getElementById('detailRoot').classList.toggle('pv-page', !!g.visual);

    const slides = g.gallery;

    document.getElementById('detailRoot').innerHTML = `
      <!-- 顶层：左图集 + 右标题价格（与 L1–L3 详情页统一横版） -->
      <div class="d-top">
        <div class="d-gallery">
          <div class="slides" id="slides">
            ${slides.map(s => `<img src="${s}" alt="${g.name} 展示图" loading="lazy">`).join('')}
          </div>
          <span class="counter" id="slideCounter">1/${slides.length}</span>
        </div>

        <div class="d-intro">
          <div class="en-name">${g.enName}</div>
          <h1>${g.name}</h1>
          <p class="tagline">${g.tagline}</p>
          <div class="meta">
            ${g.meta.map(m => `<span>${m}</span>`).join('')}
          </div>
          ${g.introShort ? `<p class="intro-desc">${g.introShort}</p>` : ''}
          <div class="d-price-row">
            ${g.priceLabel
              ? `<div class="price">${g.pricePrefix ? `<span class="prefix">${g.pricePrefix}</span>` : ''}<span class="cur">¥</span><span class="num">${g.priceLabel}</span><span class="unit">${g.priceSuffix || ''}</span></div>`
              : `<div class="price-text">${g.priceText || '详询客服'}</div>`}
            <span class="sold">${g.levelTag}</span>
          </div>
        </div>
      </div>

      <div class="wrap g-body">
        ${g.visual ? `
        <!-- ① 一套游戏 · 多重收获 -->
        <section class="pv-band">
          <h2 class="pv-h">一套游戏 · 多重收获</h2>
          <div class="pv-points">${g.visual.harvest.map(p => `<span>${p}</span>`).join('')}</div>
        </section>

        <!-- ② 三大支柱 -->
        <section class="pv-cream pv-pillars">
          ${g.visual.pillars.map(p => `
            <div class="pv-pillar">
              <div class="pv-no">${p.n}</div>
              <div class="pv-ptxt"><b>${p.t}</b><p>${p.d}</p></div>
            </div>`).join('')}
        </section>

        <!-- ③ 双游戏模式 -->
        <section class="pv-band">
          <div class="pv-script">Two in One</div>
          <h2 class="pv-h">双游戏模式 · 乐趣加倍</h2>
          <p class="pv-sub">内含"宝石矿工"和"出7不易"两种玩法，体验丰富不单调，极大提升游戏的重复可玩性</p>
          <div class="pv-mode-grid">
            ${g.visual.modes.map(m => `
              <figure class="pv-mode">
                <img src="${m.img}" alt="${m.name}" loading="lazy">
                <figcaption><span class="pv-chip">${m.tag}</span><b>${m.name}</b><p>${m.d}</p></figcaption>
              </figure>`).join('')}
          </div>
        </section>

        <!-- ④ 派对主题 -->
        <section class="pv-cream">
          <div class="pv-script2">Party</div>
          <h2 class="pv-h2">${g.visual.partyTitle}</h2>
          <p class="pv-pd">${g.visual.partyDesc}</p>
          <img class="pv-partyimg" src="${g.visual.partyImg}" alt="派对主题插画" loading="lazy">
        </section>

        <!-- ⑤ 一张图看懂怎么玩 -->
        <section class="pv-band">
          <h2 class="pv-h">${g.visual.howTitle}</h2>
          <img class="pv-howimg" src="${g.visual.howImg}" alt="派对棋盘全貌" loading="lazy">
          <div class="pv-mech">
            ${g.modules.map((m, i) => `
              <div class="pv-mech-item">
                <span class="pv-mn">${i + 1}</span>
                <div><b>${m.name}</b><em>${m.em}</em><p>${m.items}</p></div>
              </div>`).join('')}
          </div>
        </section>

        <!-- ⑥ 好教具 -->
        <section class="pv-cream">
          <h2 class="pv-h2">${g.visual.toolsTitle}</h2>
          <div class="pv-tool-grid">
            ${g.visual.tools.map(t => `
              <figure class="pv-tool">
                <img src="${t.img}" alt="${t.t}" loading="lazy">
                <figcaption><b>${t.t}</b><p>${t.d}</p></figcaption>
              </figure>`).join('')}
          </div>
        </section>

        <!-- ⑦ 全家福 -->
        <section class="pv-band">
          <h2 class="pv-h">${g.visual.kitTitle}</h2>
          <img class="pv-kitimg" src="${g.visual.kitImg}" alt="盒内配置全家福" loading="lazy">
        </section>

        <div class="d-sec full-span">
          <h2>${g.stepsTitle}</h2>
          <div class="d-steps">
            ${g.steps.map((s, i) => `
              <div class="d-step">
                <div class="no">${i + 1}</div>
                <div><b>${s.t}</b><span>${s.d}</span></div>
              </div>`).join('')}
          </div>
        </div>

        <div class="d-sec">
          <h2>产品参数</h2>
          <div class="stats-grid">
            ${g.stats.map(s => `<div class="stat"><b>${s.n}</b><span>${s.label}</span></div>`).join('')}
          </div>
        </div>

        <div class="d-sec">
          <h2>配套视频课 / 陪跑</h2>
          <div class="course-box">
            <img src="${g.courseImg || g.gallery[0]}" alt="配套课程" loading="lazy">
            <p>${g.courseNote}</p>
          </div>
        </div>

        <div class="d-sec">
          <h2>玩过之后，孩子将获得</h2>
          ${g.outcomes.map(o => `
            <div class="outcome-group">
              <b>${o.g}</b>
              <p>${o.items}</p>
            </div>`).join('')}
        </div>

        <div class="d-sec full-span">
          <h2>购买与服务</h2>
          <ul class="dot-list">${g.purchase.map(s => `<li>${s}</li>`).join('')}</ul>
        </div>
        ` : g.sellGroups ? `
        <!-- 有卖点详解的产品：删重复核心卖点，长文区块满宽铺开 -->
        <div class="d-sec">
          <h2>游戏介绍</h2>
          <p>${g.desc}</p>
        </div>

        <div class="d-sec">
          <h2>培养能力点</h2>
          <div class="chips">${g.abilities.map(a => `<span>${a}</span>`).join('')}</div>
        </div>

        <div class="d-sec">
          <h2>产品数据</h2>
          <div class="stats-grid">
            ${g.stats.map(s => `<div class="stat"><b>${s.n}</b><span>${s.label}</span></div>`).join('')}
          </div>
        </div>

        <div class="d-sec">
          <h2>适合谁</h2>
          <div class="audience-box">${g.audience}</div>
        </div>

        <div class="d-sec full-span">
          <h2>${g.sellGroupsTitle || '核心卖点详解'}</h2>
          <div class="cols2">
            ${g.sellGroups.map(sg => `
              <div class="sell-group">
                <b>${sg.g}</b>
                <ul class="dot-list">${sg.items.map(s => `<li>${s}</li>`).join('')}</ul>
              </div>`).join('')}
          </div>
          ${g.sellConclusion ? `<p class="sell-conclusion">${g.sellConclusion}</p>` : ''}
        </div>

        <div class="d-sec full-span">
          <h2>${g.modulesTitle}</h2>
          <div class="cols2">
            ${g.modules.map((m, i) => `
              <div class="module">
                <div class="m-no">${i + 1}</div>
                <div>
                  <b>${m.name}${m.em ? `<em>${m.em}</em>` : ''}</b>
                  <span>${m.items}</span>
                </div>
              </div>`).join('')}
          </div>
        </div>

        ${g.research ? `
        <div class="d-sec full-span">
          <h2>${g.researchTitle || '教育价值论证'}</h2>
          ${g.researchNote ? `<p class="sec-note">${g.researchNote}</p>` : ''}
          <div class="cols2">
            ${g.research.map(r => `
              <div class="rs-item">
                <b>${r.dim}</b>
                <ul class="dot-list">${r.points.map(p => `<li>${p}</li>`).join('')}</ul>
              </div>`).join('')}
          </div>
          ${g.positioning ? `
            <div class="cmp-block">
              <b>${g.positioningTitle || '产品定位对比'}</b>
              ${g.positioning.map(p => `
                <div class="cmp-row${p.cur ? ' cur' : ''}">
                  <span class="cmp-t">${p.t}</span>
                  <span class="cmp-d">${p.d}</span>
                </div>`).join('')}
            </div>` : ''}
          ${g.slogan ? `<p class="slogan">${g.slogan}</p>` : ''}
        </div>` : ''}

        <div class="d-sec">
          <h2>${g.stepsTitle || '玩法步骤'}</h2>
          <div class="d-steps">
            ${g.steps.map((s, i) => `
              <div class="d-step">
                <div class="no">${i + 1}</div>
                <div><b>${s.t}</b><span>${s.d}</span></div>
              </div>`).join('')}
          </div>
        </div>

        <div class="d-sec">
          <h2>配套视频课 / 教案</h2>
          <div class="course-box">
            <img src="${g.courseImg || g.gallery[0]}" alt="配套课程" loading="lazy">
            <p>${g.courseNote}</p>
          </div>
        </div>

        ${g.outcomes ? `
        <div class="d-sec">
          <h2>玩过之后，孩子将获得</h2>
          ${g.outcomes.map(o => `
            <div class="outcome-group">
              <b>${o.g}</b>
              <p>${o.items}</p>
            </div>`).join('')}
        </div>` : ''}

        ${g.highlights ? `
        <div class="d-sec">
          <h2>${g.highlightsTitle || g.highlights.length + ' 大产品亮点'}</h2>
          ${g.highlights.map(h => `
            <div class="hl"><b>${h.t}</b><span>${h.d}</span></div>`).join('')}
        </div>` : ''}

        ${g.scenarios ? `
        <div class="d-sec">
          <h2>使用场景</h2>
          <ul class="dot-list">${g.scenarios.map(s => `<li>${s}</li>`).join('')}</ul>
        </div>` : ''}

        ${g.purchase ? `
        <div class="d-sec">
          <h2>购买与服务</h2>
          <ul class="dot-list">${g.purchase.map(s => `<li>${s}</li>`).join('')}</ul>
        </div>` : ''}
        ` : `
        <!-- 无卖点详解的产品：保持原顺序 -->
        <div class="d-sec">
          <h2>游戏介绍</h2>
          <p>${g.desc}</p>
        </div>

        <div class="d-sec">
          <h2>核心卖点</h2>
          <ul class="sell-list">${g.sellTags.map(s => `<li>${s}</li>`).join('')}</ul>
          ${g.stats ? `
          <div class="stats-grid">
            ${g.stats.map(s => `<div class="stat"><b>${s.n}</b><span>${s.label}</span></div>`).join('')}
          </div>` : ''}
        </div>

        ${g.modules ? `
        <div class="d-sec">
          <h2>${g.modulesTitle}</h2>
          ${g.modules.map((m, i) => `
            <div class="module">
              <div class="m-no">${i + 1}</div>
              <div>
                <b>${m.name}${m.em ? `<em>${m.em}</em>` : ''}</b>
                <span>${m.items}</span>
              </div>
            </div>`).join('')}
        </div>` : ''}

        <div class="d-sec">
          <h2>培养能力点</h2>
          <div class="chips">${g.abilities.map(a => `<span>${a}</span>`).join('')}</div>
        </div>

        ${g.steps ? `
        <div class="d-sec">
          <h2>${g.stepsTitle || '玩法步骤'}</h2>
          <div class="d-steps">
            ${g.steps.map((s, i) => `
              <div class="d-step">
                <div class="no">${i + 1}</div>
                <div><b>${s.t}</b><span>${s.d}</span></div>
              </div>`).join('')}
          </div>
        </div>` : ''}

        <div class="d-sec">
          <h2>适合谁</h2>
          <div class="audience-box">${g.audience}</div>
        </div>

        ${g.outcomes ? `
        <div class="d-sec">
          <h2>玩过之后，孩子将获得</h2>
          ${g.outcomes.map(o => `
            <div class="outcome-group">
              <b>${o.g}</b>
              <p>${o.items}</p>
            </div>`).join('')}
        </div>` : ''}

        ${g.highlights ? `
        <div class="d-sec">
          <h2>${g.highlightsTitle || g.highlights.length + ' 大产品亮点'}</h2>
          ${g.highlights.map(h => `
            <div class="hl"><b>${h.t}</b><span>${h.d}</span></div>`).join('')}
        </div>` : ''}

        ${g.scenarios ? `
        <div class="d-sec">
          <h2>使用场景</h2>
          <ul class="dot-list">${g.scenarios.map(s => `<li>${s}</li>`).join('')}</ul>
        </div>` : ''}

        <div class="d-sec">
          <h2>配套视频课 / 教案</h2>
          <div class="course-box">
            <img src="${g.courseImg || g.gallery[0]}" alt="配套课程" loading="lazy">
            <p>${g.courseNote}</p>
          </div>
        </div>

        ${g.purchase ? `
        <div class="d-sec full-span">
          <h2>购买与服务</h2>
          <ul class="dot-list">${g.purchase.map(s => `<li>${s}</li>`).join('')}</ul>
        </div>` : ''}
        `}

        <!-- 产品图文详情 -->
        ${g.detailImgs ? `
        <div class="d-sec full-span">
          <h2>产品图文详情</h2>
          <p class="longimg-note">点击图片可查看高清大图</p>
          <div class="longimg-grid">
            ${g.detailImgs.map((s, i) => `<a class="longimg" href="${s}" target="_blank" rel="noopener"><img src="${s}" alt="${g.name} 图文详情 ${i + 1}" loading="lazy"></a>`).join('')}
          </div>
        </div>` : ''}

        <!-- 配置清单 -->
        <div class="d-sec full-span">
          <h2>${g.contentsTitle || '配置清单'}</h2>
          <div class="contents-grid">${g.contents.map(c => `<span>${c}</span>`).join('')}</div>
          ${g.contentsNote ? `<p class="contents-note">${g.contentsNote}</p>` : ''}
        </div>

        <!-- 其他游戏 -->
        <div class="d-sec full-span">
          <h2>优尔其他经典游戏</h2>
          <div class="game-switch">
            ${GAME_ORDER.map(oid => {
              const o = GAMES[oid];
              return `<a href="game.html?id=${o.id}" class="${o.id === g.id ? 'cur' : ''}">
                <img src="${o.cardImg}" alt="${o.name}" loading="lazy">
                <span>${o.name}</span></a>`;
            }).join('')}
          </div>
        </div>
      </div>
    `;

    // 轮播计数
    const slidesEl = document.getElementById('slides');
    const counter = document.getElementById('slideCounter');
    slidesEl.addEventListener('scroll', () => {
      const i = Math.round(slidesEl.scrollLeft / slidesEl.clientWidth) + 1;
      counter.textContent = `${Math.min(i, slides.length)}/${slides.length}`;
    }, { passive: true });

    // 购买栏
    document.getElementById('buybarPrice').innerHTML = g.priceLabel
      ? `${g.pricePrefix ? `<span class="prefix">${g.pricePrefix}</span>` : ''}<span class="cur">¥</span><span class="num">${g.priceLabel}</span><span class="unit">${g.priceSuffix || ''}</span>`
      : `<span style="font-size:18px;font-weight:800;">${g.priceText || '详询客服'}</span>`;
    document.getElementById('buybarNote').textContent = g.priceNote || '';

    const toast = document.getElementById('toast');
    let toastTimer;
    document.getElementById('buyBtn').addEventListener('click', () => {
      toast.textContent = '已收到您的咨询意向，客服将尽快与您联系';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      if (document.referrer && document.referrer.includes(location.host)) history.back();
      else location.href = 'index.html';
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
