<style>
/* ===== 教具图鉴页专用样式 ===== */
.tools-hero {
  background: linear-gradient(135deg, #f5f3ff 0%, #fff 100%);
  padding: 24px 16px 16px;
  text-align: center;
}
.tools-hero h1 { font-size: 22px; color: var(--ink); margin-bottom: 6px; }
.tools-hero p { font-size: 13px; color: var(--muted); }

.tools-section { max-width: 1200px; margin: 0 auto; padding: 0 16px 24px; }
.tools-section > h2 {
  font-size: 18px; margin: 20px 0 14px; color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}
.tools-section > h2::before {
  content: ""; width: 4px; height: 18px; border-radius: 2px;
  background: linear-gradient(#a78bfa, #7c3aed);
}

/* 教具网格 */
.tool-grid {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
}
.tool-card {
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background: #fff; transition: box-shadow .2s;
}
.tool-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
.tool-card .tool-img {
  width: 100%; aspect-ratio: 1/1; background: #f9fafb;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.tool-card .tool-img img { width: 100%; height: 100%; object-fit: contain; }
.tool-card .tool-info { padding: 10px 12px 12px; }
.tool-card .tool-info b { font-size: 14px; color: var(--ink); display: block; margin-bottom: 4px; }
.tool-card .tool-info .aka { font-size: 11px; color: var(--muted); line-height: 1.5; }
.tool-card .tool-info .freq {
  display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 600;
  color: #7c3aed; background: #f5f3ff; padding: 2px 8px; border-radius: 999px;
}
.multi-badge {
  position: absolute; right: 6px; bottom: 6px;
  background: rgba(0,0,0,.55); color: #fff; font-size: 10px;
  padding: 2px 8px; border-radius: 999px;
}

/* 学期分组卡片 */
.month-group { margin-bottom: 20px; }
.month-group > h3 {
  font-size: 15px; color: #6d28d9; margin-bottom: 10px;
  padding: 8px 14px; background: #f5f3ff; border-radius: 8px; border-left: 3px solid #7c3aed;
}
.theme-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.theme-table thead th {
  background: #f3f4f6; padding: 8px 10px; text-align: left; font-weight: 600;
  color: var(--ink-2); white-space: nowrap; border-bottom: 2px solid var(--line);
}
.theme-table tbody td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.5; }
.theme-table tbody tr:hover { background: #faf9ff; }
.theme-table .seq { color: var(--muted); width: 32px; text-align: center; }
.theme-table .course { font-weight: 600; color: var(--ink); white-space: nowrap; }
.theme-table .month { color: #7c3aed; white-space: nowrap; }
.theme-table .materials { color: #4b5563; }

@media (min-width: 760px) {
  .tool-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .tools-section { padding: 0 24px 32px; }
  .tools-hero h1 { font-size: 28px; }
}

.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: #7c3aed; text-decoration: none; font-size: 14px;
  margin: 16px 0 0 16px;
}
.back-link:hover { text-decoration: underline; }
</style>

    ]
  },

      { seq:31, course:'24 算混合运算沙漏版四牌（1-6 课时）', month:'7月', content:'4 人四牌不限 24 混合运算竞速，沙漏计时+纸笔升级版，综合数学能力', materials:'教具《24 算牌》4 人一套' }

/* ===== 渲染教具图鉴 ===== */
document.getElementById('toolGrid').innerHTML = TOOLS.map(function(t, idx) {
  var cover = t.imgs[0];
  var multi = t.imgs.length > 1 ? '<span class="multi-badge">' + t.imgs.length + ' 图 · 点击切换</span>' : '';
  return '<div class="tool-card' + (t.imgs.length > 1 ? ' clickable' : '') + '" data-idx="' + idx + '">' +
    '<div class="tool-img" style="position:relative;"><img src="' + cover + '" alt="' + t.name + '" loading="lazy">' + multi + '</div>' +
    '<div class="tool-info"><b>' + t.name + '</b>' +
    '<div class="aka">' + t.desc + '</div>' +
    '<span class="freq">课程出现 ' + t.freq + '</span>' +
    '</div></div>';
}).join('');

/* 多图卡片点击切换 */
var idxMap = {};
document.querySelectorAll('.tool-card.clickable').forEach(function(card) {
  card.style.cursor = 'pointer';
  card.addEventListener('click', function() {
    var i = parseInt(card.getAttribute('data-idx'), 10);
    idxMap[i] = ((idxMap[i] || 0) + 1) % TOOLS[i].imgs.length;
    card.querySelector('.tool-img img').src = TOOLS[i].imgs[idxMap[i]];
  });
});

/* ===== 渲染课程主题表 ===== */
document.getElementById('themeList').innerHTML = THEMES.map(function(g) {
  return '<div class="month-group"><h3>' + g.title + '</h3>' +
    '<div style="overflow-x:auto;"><table class="theme-table"><thead><tr>' +
    '<th class="seq">#</th><th>主题</th><th>月份</th><th>核心内容</th><th>所需材料</th>' +
    '</tr></thead><tbody>' +
    g.items.map(function(it) {
      return '<tr><td class="seq">' + it.seq + '</td>' +
        '<td class="course">' + it.course + '</td>' +
        '<td class="month">' + it.month + '</td>' +
        '<td>' + it.content + '</td>' +
        '<td class="materials">' + it.materials + '</td></tr>';
    }).join('') +
    '</tbody></table></div></div>';
}).join('');

/* ===== 离线提示 ===== */
if (navigator.onLine === false) {
  document.getElementById('offlineTip').style.display = 'block';
}
window.addEventListener('online', function() { document.getElementById('offlineTip').style.display = 'none'; });
window.addEventListener('offline', function() { document.getElementById('offlineTip').style.display = 'block'; });

/* ===== Service Worker 注册 ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
