<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>课程大纲 · L1/L2/L3 完整课程体系 — 优尔数学思维启蒙盒</title>
<meta name="description" content="优尔 L1/L2/L3 三阶段课程大纲：幼儿园版（标准教案 + 配套课件）逐课明细，与家庭版（真人视频在线课、无课件无教案）版块结构，按版本切换查看。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ea580c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="优尔启蒙">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="desktop.css">
<style>
/* ===== 课程大纲页专用样式 ===== */
.syl-l1 { --lv: #ea580c; --lv-soft: #fff7ed; --lv-line: #fed7aa; }
.syl-l2 { --lv: #16a34a; --lv-soft: #f0fdf4; --lv-line: #bbf7d0; }
.syl-l3 { --lv: #dc2626; --lv-soft: #fef2f2; --lv-line: #fecaca; }

.syl-wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }

.syl-hero {
  background: linear-gradient(160deg, #fff7ed 0%, #ffe4c7 100%);
  padding: 28px 0 24px; text-align: center;
}
.syl-hero h1 { font-size: 25px; color: var(--ink); }
.syl-hero p { font-size: 13px; color: var(--ink-2); margin-top: 8px; }

.syl-switch { background: #fff; padding: 16px 0; border-bottom: 1px solid var(--line); }
.ver-tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
.ver-tab {
  display: block; text-align: center; padding: 10px 8px;
  border: 2px solid var(--line); border-radius: 14px; background: #fff;
  transition: border-color .2s, background .2s;
}
.ver-tab b { display: block; font-size: 15px; color: var(--ink); }
.ver-tab span { display: block; font-size: 11px; color: var(--ink-2); margin-top: 3px; }
.ver-tab.on.kinder { border-color: var(--brand); background: #fff7ed; }
.ver-tab.on.kinder b { color: var(--brand); }
.ver-tab.on.home { border-color: #2563eb; background: #eff6ff; }
.ver-tab.on.home b { color: #2563eb; }
.lv-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* ===== 家庭版（视频在线课）视图 ===== */
.syl-home-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
.syl-home-board {
  background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px;
  padding: 12px 10px; text-align: center;
}
.syl-home-board b { display: block; font-size: 14px; color: #1e3a8a; line-height: 1.4; }
.syl-home-board em { display: block; font-style: normal; font-size: 12px; font-weight: 700; color: #2563eb; margin-top: 4px; }
.syl-home-total {
  margin-top: 12px; background: #fff; border: 1px solid var(--line);
  border-radius: 12px; padding: 12px; text-align: center;
}
.syl-home-total b { display: block; font-size: 19px; color: #2563eb; line-height: 1.3; }
.syl-home-total span { font-size: 11px; color: var(--ink-2); }
.syl-home-callout {
  background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 14px 16px;
}
.syl-home-callout b { display: block; font-size: 14px; color: #1e3a8a; }
.syl-home-callout span { display: block; font-size: 12px; color: #1e40af; line-height: 1.8; margin-top: 5px; }
.lv-tab {
  display: block; text-align: center; padding: 12px 8px;
  border: 2px solid var(--line); border-radius: 14px; background: #fff;
  transition: border-color .2s, background .2s;
}
.lv-tab b { display: block; font-size: 17px; color: var(--ink); }
.lv-tab span { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.lv-tab em { display: block; font-size: 11px; color: var(--ink-2); font-style: normal; margin-top: 5px; }
.lv-tab.on.lv-l1 { border-color: var(--brand); background: #fff7ed; }
.lv-tab.on.lv-l1 b { color: var(--brand); }
.lv-tab.on.lv-l2 { border-color: #16a34a; background: #f0fdf4; }
.lv-tab.on.lv-l2 b { color: #16a34a; }
.lv-tab.on.lv-l3 { border-color: #dc2626; background: #fef2f2; }
.lv-tab.on.lv-l3 b { color: #dc2626; }

.syl-main { padding: 20px 0 10px; }
.syl-block { margin-bottom: 26px; }
.syl-stage-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.syl-stage-head h2 { font-size: 20px; color: var(--lv); }
.syl-stage-head p { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.syl-go { font-size: 13px; font-weight: 700; color: var(--lv); white-space: nowrap; }

.syl-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.syl-stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; }
.syl-stat b { display: block; font-size: 19px; color: var(--lv); line-height: 1.3; }
.syl-stat span { font-size: 11px; color: var(--ink-2); }

.syl-h2 { font-size: 17px; margin-bottom: 6px; padding-left: 10px; border-left: 4px solid var(--lv); line-height: 1.3; }
.syl-note { font-size: 12px; color: var(--ink-2); margin: 0 0 12px 14px; }

.syl-mods { display: grid; gap: 10px; }
.syl-mod { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.syl-mod b { display: block; font-size: 14px; }
.syl-mod em { display: block; font-size: 11px; color: var(--lv); font-style: normal; margin-top: 3px; }
.syl-mod span { display: block; font-size: 12px; color: var(--ink-2); margin-top: 5px; line-height: 1.7; }

.syl-group { background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.syl-group > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; background: var(--lv-soft);
  font-weight: 700; font-size: 14px; color: var(--ink);
}
.syl-group > summary::-webkit-details-marker { display: none; }
.syl-group > summary::after {
  content: "▾"; flex: none; color: var(--lv); font-size: 12px; transition: transform .2s;
}
.syl-group[open] > summary::after { transform: rotate(180deg); }
.sg-title { flex: 1; min-width: 0; }
.sg-count { font-style: normal; font-size: 11px; font-weight: 700; color: var(--lv); background: #fff; border-radius: 999px; padding: 2px 9px; flex: none; }

.syl-tablewrap { overflow-x: auto; }
.syl-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 660px; }
.syl-table th {
  background: #f9fafb; text-align: left; font-weight: 700; color: var(--ink-2);
  padding: 9px 10px; border-bottom: 2px solid var(--line); white-space: nowrap;
}
.syl-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.65; }
.syl-table tbody tr:last-child td { border-bottom: none; }
.syl-table td:first-child { color: var(--ink-2); width: 34px; }

.syl-next { display: grid; gap: 12px; }
.syl-next-card {
  display: block; background: #fff; border: 1px solid var(--line);
  border-radius: 14px; padding: 16px 18px; transition: box-shadow .2s, transform .2s;
}
.syl-next-card b { display: block; font-size: 15px; }
.syl-next-card span { display: block; font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.syl-next-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,.07); transform: translateY(-2px); }

.syl-foot { text-align: center; padding: 26px 16px 34px; font-size: 12px; color: var(--ink-2); }

/* 手机端：表格转卡片式 */
@media (max-width: 759px) {
  .syl-table { min-width: 0; }
  .syl-table thead { display: none; }
  .syl-table, .syl-table tbody, .syl-table tr, .syl-table td { display: block; width: 100%; }
  .syl-table tr { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .syl-table tr:last-child { border-bottom: none; }
  .syl-table td { border: none; padding: 3px 0; display: flex; gap: 10px; }
  .syl-table td::before { content: attr(data-label); flex: none; width: 58px; color: var(--ink-2); font-size: 12px; }
  .syl-table td:first-child { width: auto; }
}

/* 平板 */
@media (min-width: 760px) {
  .syl-wrap { max-width: 900px; padding: 0 24px; }
  .syl-hero { padding: 34px 0 28px; }
  .syl-hero h1 { font-size: 30px; }
  .syl-stats { grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .syl-mods { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .syl-next { grid-template-columns: repeat(2, 1fr); }
  .ver-tab { padding: 12px 10px; }
  .ver-tab b { font-size: 16px; }
  .ver-tab span { font-size: 12px; }
  .syl-home-grid { gap: 12px; }
}

/* 宽屏横版 */
@media (min-width: 1200px) {
  .syl-wrap { max-width: 1360px; padding: 0 32px; }
  .syl-hero { padding: 48px 0 40px; }
  .syl-hero h1 { font-size: 38px; }
  .syl-hero p { font-size: 15px; }
  .syl-switch { padding: 22px 0; }
  .lv-tabs { gap: 18px; }
  .lv-tab { padding: 18px 14px; border-radius: 18px; }
  .lv-tab b { font-size: 22px; }
  .lv-tab span { font-size: 14px; }
  .lv-tab em { font-size: 12px; }
  .syl-main { padding: 30px 0 20px; }
  .syl-block { margin-bottom: 34px; }
  .syl-stage-head h2 { font-size: 26px; }
  .syl-stage-head p { font-size: 14px; }
  .syl-go { font-size: 15px; }
  .syl-stats { gap: 16px; margin-top: 20px; }
  .syl-stat { padding: 16px 12px; border-radius: 14px; }
  .syl-stat b { font-size: 26px; }
  .syl-stat span { font-size: 12px; }
  .syl-h2 { font-size: 21px; margin-bottom: 8px; }
  .syl-note { font-size: 13px; }
  .syl-mods { grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .syl-mod { padding: 16px 18px; }
  .ver-tab { padding: 16px 14px; border-radius: 16px; }
  .ver-tab b { font-size: 18px; }
  .ver-tab span { font-size: 13px; }
  .ver-tabs { gap: 18px; margin-bottom: 18px; }
  .syl-home-grid { gap: 16px; }
  .syl-home-board { padding: 18px 16px; }
  .syl-home-board b { font-size: 16px; }
  .syl-home-board em { font-size: 13px; }
  .syl-home-callout { padding: 20px 24px; }
  .syl-home-callout b { font-size: 16px; }
  .syl-home-callout span { font-size: 13px; }
  .syl-mod b { font-size: 15px; }
  .syl-group > summary { padding: 14px 18px; font-size: 15px; }
  .syl-table { font-size: 13px; }
  .syl-table th { padding: 11px 14px; }
  .syl-table td { padding: 11px 14px; }
  .syl-next { grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .syl-next-card { padding: 22px 24px; }
  .syl-next-card b { font-size: 17px; }
}
</style>
</head>

    <div class="lv-tabs" id="lvTabs"></div>

  <div class="syl-wrap" id="sylBody"></div>

<script src="syllabus-data.js"></script>
<script>
(function () {
  const COL_LABEL = { seq: '#', month: '月份', course: '课程', content: '核心内容', games: '主要游戏', materials: '所需材料' };

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function cell(it, c) {
    const v = it[c];
    if (v === null || v === undefined || v === '') return '—';
    return esc(v);
  }
  function totalItems(s) {
    return s.groups.reduce(function (a, g) { return a + g.items.length; }, 0);
  }
  function lvParam() {
    const q = (new URLSearchParams(location.search).get('lv') || '').toUpperCase();
    return SYLLABUS[q] ? q : 'L1';
  }
  function verParam() {
    const v = (new URLSearchParams(location.search).get('v') || '').toLowerCase();
    return v === 'home' ? 'home' : 'kinder';
  }
  function verName(k) { return k === 'home' ? '家庭版' : '幼儿园版'; }
  function lvHref(lv, ver) { return '?lv=' + lv + (ver === 'home' ? '&v=home' : ''); }
  function renderVerTabs(active) {
    const list = [
      { k: 'kinder', t: '幼儿园版', s: '标准教案 + 配套课件 · 集体教学' },
      { k: 'home', t: '家庭版', s: '真人视频在线课 · 无课件无教案' }
    ];
    document.getElementById('verTabs').innerHTML = list.map(function (x) {
      return '<a class="ver-tab ' + x.k + (x.k === active ? ' on' : '') + '" href="' +
        lvHref(lvParam(), x.k) + '" data-v="' + x.k + '">' +
        '<b>' + x.t + '</b><span>' + x.s + '</span></a>';
    }).join('');
  }
  function unitOf(lv) { return lv === 'L3' ? '个学期' : '个月'; }
  function groupUnit(lv) { return lv === 'L3' ? '学期' : '月份'; }
  function toolsPage(lv) { return lv === 'L1' ? 'tools.html' : 'tools-' + lv.toLowerCase() + '.html'; }

  function renderTabs(active, ver) {
    document.getElementById('lvTabs').innerHTML = SYLLABUS_ORDER.map(function (lv) {
      const s = SYLLABUS[lv];
      const cls = 'lv-tab lv-' + lv.toLowerCase() + (lv === active ? ' on' : '');
      return '<a class="' + cls + '" href="' + lvHref(lv, ver) + '" data-lv="' + lv + '">' +
        '<b>' + esc(s.level) + '</b>' +
        '<span>' + esc(s.name.replace(/^L\d\s*/, '')) + '</span>' +
        '<em>' + esc(s.age) + ' · ' + totalItems(s) + ' 课</em>' +
        '</a>';
    }).join('');
  }

  /* 家庭版视图：视频在线课，无课件无教案，仅展示版块结构 */
  function renderHome(lv, s) {
    const h = s.home;
    const boards = h.boards.map(function (b) {
      return '<div class="syl-home-board"><b>' + esc(b.name) + '</b>' +
        (b.count ? '<em>' + esc(b.count) + '</em>' : '') + '</div>';
    }).join('');
    const total = h.total
      ? '<div class="syl-home-total"><b>' + esc(h.total) + '</b><span>家庭版视频课总量</span></div>'
      : '';

    document.getElementById('sylBody').innerHTML =
      '<section class="syl-block">' +
        '<div class="syl-stage-head">' +
          '<div><h2>' + esc(s.name) + ' · 家庭版</h2>' +
          '<p>' + esc(s.age) + ' · ' + esc(h.title) + ' · 家长在家陪玩</p></div>' +
          '<a class="syl-go" href="detail.html?id=' + esc(s.productId) + '&tab=curriculum">查看产品详情 →</a>' +
        '</div>' +
      '</section>' +

      '<section class="syl-block">' +
        '<h2 class="syl-h2">版块结构</h2>' +
        '<p class="syl-note">' + esc(h.planNote) + ' · 盒内教具、材料与图鉴与幼儿园版完全共享</p>' +
        '<div class="syl-home-grid">' + boards + '</div>' +
        total +
      '</section>' +

      '<section class="syl-block">' +
        '<div class="syl-home-callout">' +
          '<b>' + esc(h.planNote) + '</b>' +
          '<span>家庭版课程为<b>视频在线学习</b>，<b>不含</b>幼儿园版那样的标准教案与配套课件；家长跟着视频引导即可，无需备课。' +
          '<br>' + esc(h.disclaimer) + '</span>' +
        '</div>' +
      '</section>' +

      '<section class="syl-block syl-next">' +
        '<a class="syl-next-card" href="' + toolsPage(lv) + '"><b>' + esc(s.level) + ' 教具图鉴 &amp; 材料明细</b>' +
        '<span>每件教具、每个游戏对应材料一目了然</span></a>' +
        '<a class="syl-next-card" href="detail.html?id=' + esc(s.productId) + '&tab=curriculum"><b>' + esc(s.name) + ' · 产品详情</b>' +
        '<span>家庭版 / 幼儿园版两套课程体系对比</span></a>' +
      '</section>';
  }

  function renderBody(lv, ver) {
    const s = SYLLABUS[lv];
    if (ver === 'home' && s.home) { renderHome(lv, s); return; }
    const items = totalItems(s);
    const groups = s.groups.length;

    const statsHtml = s.stats.map(function (x) {
      return '<div class="syl-stat"><b>' + esc(x.n) + '</b><span>' + esc(x.l) + '</span></div>';
    }).join('');

    const modulesHtml = s.modules.map(function (m) {
      return '<div class="syl-mod"><b>' + esc(m.name) + '</b>' +
        (m.sub ? '<em>' + esc(m.sub) + '</em>' : '') +
        '<span>' + esc(m.items) + '</span></div>';
    }).join('');

    const groupsHtml = s.groups.map(function (g, i) {
      const head = s.columns.map(function (c) { return '<th>' + COL_LABEL[c] + '</th>'; }).join('');
      const rows = g.items.map(function (it) {
        return '<tr>' + s.columns.map(function (c) {
          return '<td data-label="' + COL_LABEL[c] + '">' + cell(it, c) + '</td>';
        }).join('') + '</tr>';
      }).join('');
      return '<details class="syl-group"' + (i === 0 ? ' open' : '') + '>' +
        '<summary><span class="sg-title">' + esc(g.title) + '</span>' +
        '<em class="sg-count">' + g.items.length + ' 课</em></summary>' +
        '<div class="syl-tablewrap"><table class="syl-table">' +
        '<thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '</details>';
    }).join('');

    document.getElementById('sylBody').innerHTML =
      '<section class="syl-block">' +
        '<div class="syl-stage-head">' +
          '<div><h2>' + esc(s.name) + '</h2>' +
          '<p>' + esc(s.age) + ' · ' + esc(s.goal) + ' · ' + groups + ' ' + unitOf(lv) + ' · ' + items + ' 课明细</p></div>' +
          '<a class="syl-go" href="detail.html?id=' + esc(s.productId) + '">查看产品详情 →</a>' +
        '</div>' +
        '<div class="syl-stats">' + statsHtml + '</div>' +
      '</section>' +

      '<section class="syl-block">' +
        '<h2 class="syl-h2">' + esc(s.modulesTitle) + '</h2>' +
        '<div class="syl-mods">' + modulesHtml + '</div>' +
      '</section>' +

      '<section class="syl-block">' +
        '<h2 class="syl-h2">幼儿园版 · 逐课明细表（共 ' + items + ' 课）</h2>' +
        '<p class="syl-note">本表为<b>幼儿园版</b>课程体系（含标准教案与配套课件），按' + groupUnit(lv) + '分组，点击标题可展开 / 收起；' +
        '各课所需材料与家庭版<b>完全共用同一套教具</b>，学习内容不同、教具相同。</p>' +
        groupsHtml +
      '</section>' +

      '<section class="syl-block syl-next">' +
        '<a class="syl-next-card" href="' + toolsPage(lv) + '"><b>' + esc(s.level) + ' 教具图鉴 &amp; 材料明细</b>' +
        '<span>每件教具、每个游戏对应材料一目了然</span></a>' +
        '<a class="syl-next-card" href="detail.html?id=' + esc(s.productId) + '"><b>' + esc(s.name) + ' · 产品详情</b>' +
        '<span>玩法、卖点、盒内清单、采购服务</span></a>' +
      '</section>';
  }

  function go(lv, push, ver) {
    ver = ver || verParam();
    if (push) history.pushState({ lv: lv, v: ver }, '', lvHref(lv, ver));
    document.body.className = 'syl syl-' + lv.toLowerCase();
    renderVerTabs(ver);
    renderTabs(lv, ver);
    renderBody(lv, ver);
    window.scrollTo({ top: 0, behavior: push ? 'smooth' : 'auto' });
  }

  document.getElementById('lvTabs').addEventListener('click', function (e) {
    const a = e.target.closest('a[data-lv]');
    if (!a) return;
    e.preventDefault();
    if (a.dataset.lv === lvParam()) return;
    go(a.dataset.lv, true, verParam());
  });

  document.getElementById('verTabs').addEventListener('click', function (e) {
    const a = e.target.closest('a[data-v]');
    if (!a) return;
    e.preventDefault();
    if (a.dataset.v === verParam()) return;
    go(lvParam(), true, a.dataset.v);
  });

  window.addEventListener('popstate', function (e) {
    go((e.state && e.state.lv) || lvParam(), false, (e.state && e.state.v) || verParam());
  });

  go(lvParam(), false);

  if (navigator.onLine === false) document.getElementById('offlineTip').style.display = 'block';
  window.addEventListener('online', function () { document.getElementById('offlineTip').style.display = 'none'; });
  window.addEventListener('offline', function () { document.getElementById('offlineTip').style.display = 'block'; });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
